<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de semillas — CEPT N°30</title>
<style>
  :root {
    --verde: #2f6b3a; --verde-claro: #e6f1e4; --fondo: #f6f5ef; --tarjeta: #ffffff;
    --texto: #23301f; --suave: #5f6b5a; --borde: #d9dccf;
    --ok: #2f6b3a; --poco: #a86400; --sin: #a33a2c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.4; }
  .pagina { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
  header h1 { font-size: 1.5rem; margin: 8px 0 2px; color: var(--verde); }
  header p { margin: 0; color: var(--suave); font-size: .9rem; }
  .indicadores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 16px 0; }
  @media (min-width: 560px) { .indicadores { grid-template-columns: repeat(4, 1fr); } }
  .indicador { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; }
  .indicador b { display: block; font-size: 1.4rem; color: var(--verde); }
  .indicador span { font-size: .8rem; color: var(--suave); }
  nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  nav button, .chip { border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto);
    border-radius: 999px; padding: 9px 14px; font-size: .92rem; white-space: nowrap; cursor: pointer; }
  nav button.activa, .chip.activa { background: var(--verde); border-color: var(--verde); color: #fff; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  input, select, textarea { width: 100%; font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--borde); border-radius: 8px; padding: 11px 12px; }
  textarea { min-height: 64px; resize: vertical; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 5px; }
  label small { font-weight: 400; color: var(--suave); }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; }
  .tarjeta h3 { margin: 0; font-size: 1.05rem; }
  .tarjeta .variedad { color: var(--suave); font-size: .92rem; }
  .fila { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .datos { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .88rem; color: var(--suave); }
  .datos b { color: var(--texto); }
  .etiqueta { font-size: .78rem; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .etiqueta.ok { background: var(--verde-claro); color: var(--ok); }
  .etiqueta.poco { background: #fbeed3; color: var(--poco); }
  .etiqueta.sin { background: #f6dfdb; color: var(--sin); }
  .boton { display: block; width: 100%; border: 0; border-radius: 10px; background: var(--verde); color: #fff;
    font: inherit; font-weight: 600; padding: 14px; margin-top: 18px; cursor: pointer; }
  .boton.secundario { background: transparent; color: var(--verde); border: 1px solid var(--verde); }
  .boton:disabled { opacity: .55; cursor: default; }
  .aviso { background: var(--verde-claro); border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: .92rem; }
  .aviso.error { background: #f6dfdb; color: var(--sin); }
  .codigo { font-size: 1.7rem; font-weight: 700; letter-spacing: .04em; color: var(--verde); margin: 6px 0; }
  .vacio { color: var(--suave); text-align: center; padding: 28px 0; }
  .oculto { display: none !important; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .95rem; }
  dt { color: var(--suave); } dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .enlace { color: var(--verde); background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
  .cabecera { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .cabecera .chip { margin-top: 8px; color: var(--verde); border-color: var(--verde); font-weight: 600; }
  #acceso { margin-top: 12px; text-align: center; }
  #acceso p { margin: 0; color: var(--suave); font-size: .9rem; }
  #boton-google { display: flex; justify-content: center; margin-top: 10px; min-height: 44px; }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div class="cabecera">
      <div>
        <h1>Biblioteca de semillas</h1>
        <p>CEPT N°30 · Sembrar en comunidad</p>
      </div>
      <button type="button" class="chip" id="docentes">Acceso docentes</button>
    </div>
    <p id="sesion" class="oculto">Sesión de carga: <span id="sesion-correo"></span> · <button type="button" class="enlace" id="salir">Salir</button></p>
    <div id="acceso" class="tarjeta oculto">
      <p id="acceso-texto">Iniciá sesión con la cuenta autorizada.</p>
      <div id="boton-google"></div>
    </div>
  </header>

  <div id="cargando" class="vacio">Cargando la biblioteca…</div>
  <div id="aviso" class="aviso oculto"></div>

  <div id="contenido" class="oculto">
    <div class="indicadores" id="indicadores"></div>
    <nav id="solapas" class="oculto"></nav>

    <section id="vista-biblioteca">
      <input id="buscar" type="search" placeholder="Buscar especie o variedad" autocomplete="off">
      <div class="filtros" id="filtros"></div>
      <div id="lista"></div>
    </section>

    <section id="vista-ingreso" class="oculto">
      <form id="form-ingreso" autocomplete="off">
        <label for="i-especie">Especie</label>
        <input id="i-especie" list="lista-especies" required>
        <datalist id="lista-especies"></datalist>
        <label for="i-variedad">Variedad <small>(si no se conoce, dejar vacío)</small></label>
        <input id="i-variedad" list="lista-variedades">
        <datalist id="lista-variedades"></datalist>
        <div id="i-nueva" class="oculto">
          <div class="aviso">Esta variedad todavía no está en el catálogo. Elegí su temporada de siembra para agregarla.</div>
          <label for="i-temporada">Temporada de siembra</label>
          <select id="i-temporada"></select>
        </div>
        <label for="i-gramos">Gramos</label>
        <input id="i-gramos" type="number" min="0" step="any" inputmode="decimal" required>
        <label for="i-origen">Origen</label>
        <select id="i-origen"></select>
        <label for="i-anio">Año de cosecha <small>(opcional)</small></label>
        <input id="i-anio" type="number" min="1990" step="1" inputmode="numeric">
        <label for="i-dona">Quién dona <small>(opcional)</small></label>
        <input id="i-dona" list="lista-donantes">
        <datalist id="lista-donantes"></datalist>
        <label for="i-pg">Poder germinativo en % <small>(opcional)</small></label>
        <input id="i-pg" type="number" min="0" max="100" step="any" inputmode="decimal">
        <label for="i-obs">Observaciones <small>(opcional)</small></label>
        <textarea id="i-obs"></textarea>
        <button class="boton" type="submit">Revisar y guardar</button>
      </form>
    </section>

    <section id="vista-prestamo" class="oculto">
      <form id="form-prestamo" autocomplete="off">
        <label for="p-variedad">Especie y variedad</label>
        <select id="p-variedad" required></select>
        <label for="p-lote">Lote</label>
        <select id="p-lote" required></select>
        <label for="p-gramos">Gramos que se retiran</label>
        <input id="p-gramos" type="number" min="0" step="any" inputmode="decimal" required>
        <label for="p-familia">Familia o persona que retira</label>
        <input id="p-familia" list="lista-familias" required>
        <datalist id="lista-familias"></datalist>
        <label for="p-fecha">Fecha</label>
        <input id="p-fecha" type="date">
        <label for="p-obs">Observaciones <small>(opcional)</small></label>
        <textarea id="p-obs"></textarea>
        <button class="boton" type="submit">Revisar y guardar</button>
      </form>
    </section>

    <section id="vista-prestamos" class="oculto">
      <div id="lista-prestamos"></div>
      <form id="form-devolucion" class="oculto" autocomplete="off">
        <div class="aviso" id="d-detalle"></div>
        <label for="d-gramos">Gramos devueltos <small>(0 si no hubo cosecha)</small></label>
        <input id="d-gramos" type="number" min="0" step="any" inputmode="decimal" required>
        <label for="d-anio">Año de cosecha <small>(opcional)</small></label>
        <input id="d-anio" type="number" min="1990" step="1" inputmode="numeric">
        <label for="d-pg">Poder germinativo en % <small>(opcional)</small></label>
        <input id="d-pg" type="number" min="0" max="100" step="any" inputmode="decimal">
        <label for="d-fecha">Fecha de devolución</label>
        <input id="d-fecha" type="date">
        <label for="d-obs">Observaciones <small>(opcional)</small></label>
        <textarea id="d-obs"></textarea>
        <button class="boton" type="submit">Revisar y guardar</button>
        <button class="boton secundario" type="button" id="d-cancelar">Volver a la lista</button>
      </form>
    </section>

    <section id="vista-confirmar" class="oculto">
      <div class="tarjeta">
        <h3 id="c-titulo"></h3>
        <dl id="c-detalle" style="margin-top:12px"></dl>
      </div>
      <div id="c-error" class="aviso error oculto"></div>
      <button class="boton" id="c-guardar" type="button">Confirmar y guardar</button>
      <button class="boton secundario" id="c-volver" type="button">Volver y corregir</button>
    </section>

    <section id="vista-listo" class="oculto">
      <div class="tarjeta">
        <h3 id="l-titulo"></h3>
        <div id="l-cuerpo"></div>
      </div>
      <button class="boton" id="l-otro" type="button">Cargar otro</button>
      <button class="boton secundario" id="l-ver" type="button">Ver la biblioteca</button>
    </section>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // Dirección de la webapp publicada en Apps Script (la que termina en /exec)
  var WEBAPP = 'https://script.google.com/macros/s/AKfycbyjyHiWikMehNZY5e2LytKqskzLLpfxbmBGlz8tyNJdTmC-n17IZLmDH7hbPJYeWRFX/exec';
  var GUARDADO = 'biblioteca-semillas';
  var SESION = 'biblioteca-semillas-sesion';

  var TOKEN = '';
  var botonListo = false;
  var DATOS = null;
  var temporadaActiva = '';
  var solapaActiva = 'biblioteca';
  var pendiente = null;      // carga en espera de confirmación
  var prestamoElegido = null;

  var SOLAPAS = [
    ['biblioteca', 'Biblioteca'], ['ingreso', 'Ingreso'],
    ['prestamo', 'Préstamo'], ['prestamos', 'Devoluciones']
  ];
  var VISTAS = ['biblioteca', 'ingreso', 'prestamo', 'prestamos', 'confirmar', 'listo'];

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t === null || t === undefined ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function clave(t) {
    return String(t || '').trim().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }
  function gramos(n) { return Number(n).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' g'; }
  function porciento(n) { return n === '' ? 'Sin dato' : Math.round(n * 100) + ' %'; }
  function hoyISO() {
    var h = new Date();
    return h.getFullYear() + '-' + ('0' + (h.getMonth() + 1)).slice(-2) + '-' + ('0' + h.getDate()).slice(-2);
  }
  function opciones(select, lista, primera) {
    select.innerHTML = (primera ? '<option value="">' + esc(primera) + '</option>' : '') +
      lista.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('');
  }
  function sugerencias(id, lista) {
    $(id).innerHTML = lista.map(function (t) { return '<option value="' + esc(t) + '">'; }).join('');
  }

  function mostrar(vista) {
    VISTAS.forEach(function (v) { $('vista-' + v).classList.toggle('oculto', v !== vista); });
    window.scrollTo(0, 0);
  }
  function irA(solapa) {
    solapaActiva = solapa;
    Array.prototype.forEach.call($('solapas').children, function (b) {
      b.classList.toggle('activa', b.dataset.solapa === solapa);
    });
    if (solapa === 'prestamos') {
      $('form-devolucion').classList.add('oculto');
      $('lista-prestamos').classList.remove('oculto');
    }
    mostrar(solapa);
  }

  // ---------- pintar ----------

  function pintar(datos) {
    DATOS = datos;
    $('cargando').classList.add('oculto');
    $('contenido').classList.remove('oculto');
    $('sesion').classList.toggle('oculto', !datos.admin);
    $('sesion-correo').textContent = datos.correo;
    $('docentes').classList.toggle('oculto', datos.admin);
    if (datos.admin) $('acceso').classList.add('oculto');

    var r = datos.resumen;
    $('indicadores').innerHTML = [
      [r.variedades, 'variedades con semilla'], [gramos(r.disponible), 'disponibles'],
      [r.lotes, 'lotes ingresados'], [Math.round(r.comunidad * 100) + ' %', 'lotes de la comunidad']
    ].map(function (i) {
      return '<div class="indicador"><b>' + esc(i[0]) + '</b><span>' + esc(i[1]) + '</span></div>';
    }).join('');

    $('filtros').innerHTML = [''].concat(datos.temporadas).map(function (t) {
      return '<button type="button" class="chip' + (t === temporadaActiva ? ' activa' : '') +
        '" data-temporada="' + esc(t) + '">' + esc(t || 'Todas') + '</button>';
    }).join('');
    pintarLista();

    if (datos.admin) {
      $('solapas').classList.remove('oculto');
      $('solapas').innerHTML = SOLAPAS.map(function (s) {
        return '<button type="button" data-solapa="' + s[0] + '"' +
          (s[0] === solapaActiva ? ' class="activa"' : '') + '>' + s[1] + '</button>';
      }).join('');
      prepararFormularios();
      pintarPrestamos();
    } else {
      $('solapas').classList.add('oculto');
      if (solapaActiva !== 'biblioteca') { solapaActiva = 'biblioteca'; mostrar('biblioteca'); }
    }
  }

  function estado(v) {
    if (v.disponible <= 0) return ['sin', 'Sin stock'];
    if (v.disponible < DATOS.pocoStock) return ['poco', 'Poco stock'];
    return ['ok', 'Disponible'];
  }

  function pintarLista() {
    var texto = clave($('buscar').value);
    var lista = DATOS.variedades.filter(function (v) {
      return (!temporadaActiva || v.temporada === temporadaActiva) &&
        (!texto || clave(v.especie + ' ' + v.variedad).indexOf(texto) >= 0);
    });
    $('lista').innerHTML = lista.length ? lista.map(function (v) {
      var e = estado(v);
      return '<div class="tarjeta"><div class="fila"><div><h3>' + esc(v.especie) + '</h3>' +
        '<div class="variedad">' + esc(v.variedad) + '</div></div>' +
        '<span class="etiqueta ' + e[0] + '">' + e[1] + '</span></div>' +
        '<div class="datos"><span><b>' + gramos(v.disponible) + '</b> disponibles</span>' +
        '<span>Siembra: <b>' + esc(v.temporada || 'Sin dato') + '</b></span>' +
        '<span>Poder germinativo: <b>' + porciento(v.pg) + '</b></span>' +
        '<span>Lotes: <b>' + v.lotes + '</b></span></div></div>';
    }).join('') : '<div class="vacio">No hay variedades que coincidan.</div>';
  }

  function prepararFormularios() {
    var especies = [];
    DATOS.catalogo.forEach(function (c) { if (especies.indexOf(c.especie) < 0) especies.push(c.especie); });
    sugerencias('lista-especies', especies);
    sugerencias('lista-donantes', DATOS.donantes);
    sugerencias('lista-familias', DATOS.familias);
    opciones($('i-origen'), DATOS.origenes.map(function (o) { return [o, o]; }));
    opciones($('i-temporada'), DATOS.temporadas.map(function (t) { return [t, t]; }), 'Elegir…');
    revisarVariedad();

    var conStock = [];
    DATOS.lotes.forEach(function (l) {
      var k = l.especie + '|' + l.variedad;
      if (l.disponible > 0 && conStock.indexOf(k) < 0) conStock.push(k);
    });
    conStock.sort(function (a, b) { return a.localeCompare(b, 'es'); });
    opciones($('p-variedad'), conStock.map(function (k) { return [k, k.replace('|', ' · ')]; }), 'Elegir…');
    lotesDeVariedad();
    if (!$('p-fecha').value) $('p-fecha').value = hoyISO();
  }

  function revisarVariedad() {
    var esp = clave($('i-especie').value);
    var vari = clave($('i-variedad').value) || clave('Sin identificar');
    sugerencias('lista-variedades', DATOS.catalogo.filter(function (c) { return clave(c.especie) === esp; })
      .map(function (c) { return c.variedad; }));
    var existe = DATOS.catalogo.some(function (c) {
      return clave(c.especie) === esp && clave(c.variedad) === vari;
    });
    $('i-nueva').classList.toggle('oculto', !esp || existe);
    return existe;
  }

  function lotesDeVariedad() {
    var k = $('p-variedad').value;
    var lotes = DATOS.lotes.filter(function (l) { return l.especie + '|' + l.variedad === k && l.disponible > 0; });
    opciones($('p-lote'), lotes.map(function (l) {
      return [l.codigo, l.codigo + ' — ' + gramos(l.disponible) + (l.pg === '' ? '' : ' — PG ' + porciento(l.pg))];
    }), lotes.length === 1 ? '' : 'Elegir…');
  }

  function pintarPrestamos() {
    $('lista-prestamos').innerHTML = DATOS.prestamos.length ? DATOS.prestamos.map(function (p) {
      var viejo = p.dias > 365;
      return '<div class="tarjeta"><div class="fila"><div><h3>' + esc(p.familia) + '</h3>' +
        '<div class="variedad">' + esc(p.especie + ' · ' + p.variedad) + '</div></div>' +
        '<span class="etiqueta ' + (viejo ? 'sin' : 'poco') + '">' + (viejo ? 'A revisar' : 'Prestado') + '</span></div>' +
        '<div class="datos"><span><b>' + gramos(p.gramos) + '</b></span><span>Lote <b>' + esc(p.lote) + '</b></span>' +
        '<span>Desde <b>' + esc(p.fecha) + '</b></span></div>' +
        '<button class="boton secundario" type="button" data-fila="' + p.fila + '">Registrar devolución</button></div>';
    }).join('') : '<div class="vacio">No hay préstamos pendientes de devolución.</div>';
  }

  // ---------- cargas ----------

  function confirmar(titulo, detalle, funcion, carga, alTerminar) {
    pendiente = { funcion: funcion, carga: carga, alTerminar: alTerminar };
    $('c-titulo').textContent = titulo;
    $('c-detalle').innerHTML = detalle.map(function (d) {
      return '<dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1] === '' ? '—' : d[1]) + '</dd>';
    }).join('');
    $('c-error').classList.add('oculto');
    $('c-guardar').disabled = false;
    $('c-guardar').textContent = 'Confirmar y guardar';
    mostrar('confirmar');
  }

  function guardar() {
    var boton = $('c-guardar');
    boton.disabled = true;
    boton.textContent = 'Guardando…';
    pedir(pendiente.funcion, pendiente.carga)
      .then(function (r) {
        var cierre = pendiente.alTerminar(r);
        pendiente = null;
        pintar(r.datos);
        $('l-titulo').textContent = cierre[0];
        $('l-cuerpo').innerHTML = cierre[1];
        mostrar('listo');
      })
      .catch(function (e) {
        var texto = e.message || 'No se pudo guardar. Probá de nuevo.';
        if (texto === 'SESION_VENCIDA') {
          texto = 'La sesión venció. Volvé a iniciar sesión al pie de la página y repetí la carga.';
          cerrarSesion();
        } else if (e instanceof TypeError) {
          texto = 'No hay conexión. No se guardó nada; probá de nuevo cuando vuelva la señal.';
        }
        boton.disabled = false;
        boton.textContent = 'Confirmar y guardar';
        $('c-error').textContent = texto;
        $('c-error').classList.remove('oculto');
      });
  }

  function codigoSobre(codigo) {
    return '<p>Escribí este código en el sobre:</p><div class="codigo">' + esc(codigo) + '</div>';
  }

  $('form-ingreso').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var existe = revisarVariedad();
    if (!existe && !$('i-temporada').value) { $('i-temporada').focus(); return; }
    var c = {
      especie: $('i-especie').value.trim(), variedad: $('i-variedad').value.trim(),
      temporada: existe ? '' : $('i-temporada').value, gramos: $('i-gramos').value,
      origen: $('i-origen').value, anio: $('i-anio').value, dona: $('i-dona').value.trim(),
      pg: $('i-pg').value, obs: $('i-obs').value.trim()
    };
    confirmar('Ingreso de semillas', [
      ['Especie', c.especie], ['Variedad', c.variedad || 'Sin identificar'],
      ['Gramos', gramos(c.gramos)], ['Origen', c.origen], ['Año de cosecha', c.anio],
      ['Quién dona', c.dona], ['Poder germinativo', c.pg === '' ? '' : c.pg + ' %'], ['Observaciones', c.obs]
    ].concat(existe ? [] : [['Variedad nueva, temporada', c.temporada]]), 'ingreso', c, function (r) {
      $('form-ingreso').reset();
      return ['Ingreso guardado', codigoSobre(r.codigo)];
    });
  });

  $('form-prestamo').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var lote = DATOS.lotes.filter(function (l) { return l.codigo === $('p-lote').value; })[0];
    if (!lote) { $('p-lote').focus(); return; }
    var c = {
      lote: lote.codigo, gramos: $('p-gramos').value, familia: $('p-familia').value.trim(),
      fecha: $('p-fecha').value, obs: $('p-obs').value.trim()
    };
    if (Number(c.gramos) > lote.disponible) {
      $('p-gramos').setCustomValidity('El lote tiene ' + gramos(lote.disponible) + ' disponibles.');
      $('p-gramos').reportValidity();
      return;
    }
    confirmar('Préstamo de semillas', [
      ['Especie', lote.especie], ['Variedad', lote.variedad], ['Lote', lote.codigo],
      ['Gramos', gramos(c.gramos)], ['Retira', c.familia], ['Fecha', c.fecha.split('-').reverse().join('/')],
      ['Observaciones', c.obs]
    ], 'prestamo', c, function () {
      $('form-prestamo').reset();
      return ['Préstamo guardado', '<p>Se descontaron ' + esc(gramos(c.gramos)) + ' del lote ' + esc(lote.codigo) + '.</p>'];
    });
  });

  $('form-devolucion').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var p = prestamoElegido;
    var c = {
      fila: p.fila, lote: p.lote, gramos: $('d-gramos').value, anio: $('d-anio').value,
      pg: $('d-pg').value, fecha: $('d-fecha').value, obs: $('d-obs').value.trim()
    };
    confirmar('Devolución de semillas', [
      ['Devuelve', p.familia], ['Especie', p.especie], ['Variedad', p.variedad],
      ['Lote prestado', p.lote], ['Gramos devueltos', gramos(c.gramos)], ['Año de cosecha', c.anio],
      ['Poder germinativo', c.pg === '' ? '' : c.pg + ' %'], ['Fecha', c.fecha.split('-').reverse().join('/')],
      ['Observaciones', c.obs]
    ], 'devolucion', c, function (r) {
      $('form-devolucion').reset();
      return ['Devolución guardada', r.codigo
        ? '<p>La semilla devuelta entra como lote nuevo.</p>' + codigoSobre(r.codigo)
        : '<p>El préstamo quedó cerrado sin semilla devuelta.</p>'];
    });
  });

  // ---------- eventos ----------

  $('buscar').addEventListener('input', pintarLista);
  $('filtros').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-temporada]');
    if (!b) return;
    temporadaActiva = b.dataset.temporada;
    Array.prototype.forEach.call($('filtros').children, function (x) { x.classList.toggle('activa', x === b); });
    pintarLista();
  });
  $('solapas').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-solapa]');
    if (b) irA(b.dataset.solapa);
  });
  $('i-especie').addEventListener('input', revisarVariedad);
  $('i-variedad').addEventListener('input', revisarVariedad);
  $('p-variedad').addEventListener('change', lotesDeVariedad);
  $('p-gramos').addEventListener('input', function () { $('p-gramos').setCustomValidity(''); });
  $('lista-prestamos').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-fila]');
    if (!b) return;
    prestamoElegido = DATOS.prestamos.filter(function (p) { return p.fila === Number(b.dataset.fila); })[0];
    $('d-detalle').textContent = prestamoElegido.familia + ' retiró ' + gramos(prestamoElegido.gramos) + ' de ' +
      prestamoElegido.especie + ' · ' + prestamoElegido.variedad + ' (lote ' + prestamoElegido.lote + ') el ' +
      prestamoElegido.fecha + '.';
    $('d-fecha').value = hoyISO();
    $('lista-prestamos').classList.add('oculto');
    $('form-devolucion').classList.remove('oculto');
    window.scrollTo(0, 0);
  });
  $('d-cancelar').addEventListener('click', function () { irA('prestamos'); });
  $('c-guardar').addEventListener('click', guardar);
  $('c-volver').addEventListener('click', function () {
    mostrar(solapaActiva);
    if (solapaActiva === 'prestamos') {
      $('lista-prestamos').classList.add('oculto');
      $('form-devolucion').classList.remove('oculto');
    }
  });
  $('l-otro').addEventListener('click', function () { irA(solapaActiva); });
  $('l-ver').addEventListener('click', function () { irA('biblioteca'); });

  $('docentes').addEventListener('click', function () {
    $('acceso').classList.remove('oculto');
    prepararBoton();
  });
  $('salir').addEventListener('click', function () {
    cerrarSesion();
    consultar();
  });

  // ---------- comunicación con la biblioteca ----------

  // Los pedidos van sin la sesión de Google del navegador: no importa cuántas cuentas tenga el teléfono.
  // Las cargas llevan el inicio de sesión del docente, que la webapp valida con Google.
  function pedir(accion, carga) {
    return fetch(WEBAPP, {
      method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: accion, token: TOKEN, carga: carga || {} })
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'No se pudo completar el pedido.');
      return r;
    });
  }

  function avisar(texto) {
    $('aviso').textContent = texto;
    $('aviso').classList.toggle('oculto', !texto);
  }

  function consultar() {
    var previo = null;
    try { previo = JSON.parse(localStorage.getItem(GUARDADO)); } catch (e) {}
    if (!DATOS && previo && previo.datos) pintar(previo.datos);

    var pedido = TOKEN
      ? pedir('datos').then(function (r) { return r.datos; })
      : fetch(WEBAPP + '?api=datos', { credentials: 'omit', redirect: 'follow' })
          .then(function (r) { return r.json(); });
    pedido.then(function (datos) {
      avisar('');
      var rechazada = '';
      if (TOKEN && !datos.admin) {
        rechazada = correoDelToken(TOKEN);
        cerrarSesion();
      }
      pintar(datos);
      if (!datos.admin) {
        try { localStorage.setItem(GUARDADO, JSON.stringify({ datos: datos, fecha: new Date().toISOString() })); } catch (e) {}
        prepararBoton();
      }
      if (rechazada) {
        $('acceso').classList.remove('oculto');
        prepararBoton();
        $('acceso-texto').textContent = 'La cuenta ' + rechazada + ' no está autorizada para cargar. Probá con otra cuenta.';
      }
    }).catch(function (e) {
      if (e.message === 'SESION_VENCIDA') { cerrarSesion(); consultar(); return; }
      if (previo && previo.datos) {
        var f = new Date(previo.fecha);
        avisar('Sin conexión con la biblioteca. Se muestran los datos del ' + f.toLocaleDateString('es-AR') +
          ' a las ' + f.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + '.');
      } else {
        $('cargando').classList.add('oculto');
        avisar('No se pudo consultar la biblioteca. Revisá la conexión y volvé a intentar.');
      }
    });
  }

  // ---------- inicio de sesión de docentes ----------

  function cuerpoDelToken(token) {
    try {
      var b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(b))));
    } catch (e) { return {}; }
  }
  function correoDelToken(token) { return cuerpoDelToken(token).email || ''; }
  function cerrarSesion() {
    TOKEN = '';
    try { localStorage.removeItem(SESION); } catch (e) {}
  }

  // El botón de Google se dibuja cuando están el ID de cliente y la librería de Google
  function prepararBoton() {
    if (botonListo || $('acceso').classList.contains('oculto')) return;
    if (!DATOS || !DATOS.idCliente) {
      $('acceso-texto').textContent = 'El acceso de docentes todavía no está configurado.';
      return;
    }
    if (!window.google || !google.accounts || !google.accounts.id) {
      setTimeout(prepararBoton, 400);
      return;
    }
    botonListo = true;
    google.accounts.id.initialize({
      client_id: DATOS.idCliente,
      callback: function (respuesta) {
        TOKEN = respuesta.credential;
        try { localStorage.setItem(SESION, TOKEN); } catch (e) {}
        $('acceso-texto').textContent = 'Verificando la cuenta…';
        consultar();
      }
    });
    google.accounts.id.renderButton($('boton-google'),
      { theme: 'outline', size: 'large', text: 'signin_with', locale: 'es' });
  }

  try {
    var guardada = localStorage.getItem(SESION) || '';
    if (guardada && (cuerpoDelToken(guardada).exp || 0) * 1000 > Date.now() + 60000) TOKEN = guardada;
  } catch (e) {}
  consultar();
</script>
</body>
</html>
